<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ค้นหา LINE Profile - PS33</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <!-- DataTables CSS -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.7/css/dataTables.bootstrap5.min.css">
    <!-- LIFF SDK -->
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="jsconfig/config_register.js"></script>
    <style>
        body { background-color: #f0f2f5; font-family: 'Kanit', sans-serif; }
        .card-profile { display: none; border-radius: 15px; border: none; overflow: hidden; }
        .profile-header { background: linear-gradient(135deg, #00b900 0%, #009900 100%); color: white; padding: 30px; text-align: center; }
        .profile-img { width: 120px; height: 120px; border-radius: 50%; border: 5px solid white; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-top: -60px; background-color: white; object-fit: cover; }
        .profile-body { padding: 20px; background: white; text-align: center; }
        .btn-line { background-color: #00b900; color: white; border: none; }
        .btn-line:hover { background-color: #009900; color: white; }
        .sidebar-card { border-radius: 15px; border: none; height: calc(100vh - 40px); }
        .main-content { height: calc(100vh - 40px); overflow-y: auto; }
        .clickable-row { cursor: pointer; transition: background 0.2s; }
        .clickable-row:hover { background-color: #e9ecef !important; }
        .dataTables_filter { margin-bottom: 10px; }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>

<div class="container-fluid py-3">
    <div class="row">
        <!-- Sidebar: User List -->
        <div class="col-md-4 col-lg-3 mb-3">
            <div class="card sidebar-card shadow-sm">
                <div class="card-header bg-white py-3 border-0">
                    <h5 class="mb-0"><i class="bi bi-people-fill me-2 text-success"></i> รายชื่อผู้เช็คอิน</h5>
                </div>
                <div class="card-body p-2 overflow-auto">
                    <table id="userTable" class="table table-hover w-100">
                        <thead>
                            <tr>
                                <th>ชื่อที่แสดง</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Data populated by DataTables -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Main Content: Profile Search & Display -->
        <div class="col-md-8 col-lg-9">
            <div class="main-content pe-2">
                <div class="card shadow-sm p-4 mb-4 border-0" style="border-radius: 15px;">
                    <div class="text-center mb-4">
                        <img src="ps33_logo.png" width="60" alt="PS33 Logo" class="mb-2">
                        <h3>ค้นหา LINE Profile</h3>
                        <p class="text-muted small">เลือกจากรายชื่อด้านซ้าย หรือระบุ LINE User ID ด้านล่าง</p>
                    </div>

                    <div class="input-group mb-3">
                        <span class="input-group-text bg-white border-end-0"><i class="bi bi-person-badge"></i></span>
                        <input type="text" id="line_id_input" class="form-control border-start-0" placeholder="ระบุ LINE User ID (UID)...">
                        <button class="btn btn-line px-4" type="button" id="search_btn">
                            <i class="bi bi-search me-1"></i> ค้นหา
                        </button>
                    </div>
                    
                    <div id="loading" class="text-center py-3" style="display: none;">
                        <div class="spinner-border text-success" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                        <p class="mt-2 text-muted">กำลังดึงข้อมูล...</p>
                    </div>

                    <div id="error_msg" class="alert alert-danger" style="display: none;"></div>
                </div>

                <!-- Profile Result Card -->
                <div id="profile_card" class="card card-profile shadow-lg mx-auto" style="max-width: 500px;">
                    <div class="profile-header">
                        <h4 class="mb-0" id="display_name_header">---</h4>
                    </div>
                    <div class="profile-body">
                        <img id="profile_img" src="" alt="Profile Image" class="profile-img">
                        <div class="mt-3">
                            <h4 id="display_name" class="fw-bold mb-1">---</h4>
                            <p id="status_message" class="text-muted small mb-3">---</p>
                            
                            <div class="text-start bg-light p-3 rounded-3 mb-3">
                                <label class="text-muted small d-block">User ID:</label>
                                <code id="user_id_val" class="text-dark break-all" style="word-break: break-all;">---</code>
                            </div>

                            <div class="d-grid gap-2">
                                <button class="btn btn-outline-secondary btn-sm" onclick="copyId()">
                                    <i class="bi bi-copy me-1"></i> คัดลอก User ID
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Scripts -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.7/js/dataTables.bootstrap5.min.js"></script>

<script>
    $(document).ready(function() {
        // Initialize DataTables
        const table = $('#userTable').DataTable({
            ajax: 'get_checkin_users_api.php',
            columns: [
                { data: 'display_name' }
            ],
            rowCallback: function(row, data) {
                $(row).addClass('clickable-row');
                $(row).on('click', function() {
                    $('#line_id_input').val(data.user_id);
                    searchProfile(data.user_id);
                });
            },
            language: {
                url: '//cdn.datatables.net/plug-ins/1.13.7/i18n/th.json'
            },
            pageLength: 15,
            lengthChange: false
        });

        // Initialize LIFF
        liff.init({ liffId: LIFF_ID }).then(() => {
            console.log("LIFF Initialized");
        }).catch(err => console.error("LIFF Init Error:", err));

        $('#search_btn').on('click', function() {
            const val = $('#line_id_input').val().trim();
            searchProfile(val);
        });

        $('#line_id_input').on('keypress', function(e) {
            if (e.key === 'Enter') searchProfile($(this).val().trim());
        });
    });

    async function searchProfile(lineId) {
        if (!lineId) return alert('กรุณาระบุ LINE User ID');

        const profileCard = document.getElementById('profile_card');
        const errorMsg = document.getElementById('error_msg');
        const loading = document.getElementById('loading');

        // Reset UI
        profileCard.style.display = 'none';
        errorMsg.style.display = 'none';
        loading.style.display = 'block';

        try {
            const response = await fetch(`search_profile_api.php?line_id=${lineId}`);
            const result = await response.json();

            loading.style.display = 'none';

            if (result.success) {
                const profile = result.data;
                document.getElementById('profile_img').src = profile.pictureUrl || 'https://via.placeholder.com/150';
                document.getElementById('display_name').textContent = profile.displayName;
                document.getElementById('display_name_header').textContent = profile.displayName;
                document.getElementById('status_message').textContent = profile.statusMessage || 'ไม่มีสถานะ';
                document.getElementById('user_id_val').textContent = profile.userId;
                
                profileCard.style.display = 'block';
            } else {
                errorMsg.textContent = '❌ ' + (result.message || 'ไม่พบข้อมูลผู้ใช้งาน');
                errorMsg.style.display = 'block';
            }
        } catch (error) {
            loading.style.display = 'none';
            errorMsg.textContent = '❌ เกิดข้อผิดพลาดในการเชื่อมต่อ';
            errorMsg.style.display = 'block';
            console.error(error);
        }
    }

    function copyId() {
        const id = document.getElementById('user_id_val').textContent;
        navigator.clipboard.writeText(id).then(() => {
            alert('คัดลอก User ID แล้ว');
        });
    }
</script>

</body>
</html>
