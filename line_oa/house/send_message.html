        <label class="form-label">📌 รายละเอียด :</label>
        <textarea id="remark" class="form-control" placeholder="" rows="4" required></textarea>
      </div>

      <input type="hidden" id="place_name" value="พฤกษา 33" required>
      <input type="hidden" id="check_type" value="IN" readonly="true">

      <div class="mb-3">
        <label class="form-label">📷 รูปภาพ :</label>
        <input type="file" name="photo[]" id="photoInput" accept="image/*" multiple class="form-control">
      </div>

      <button type="button" class="btn btn-submit w-100" onclick="checkin()">✅ กดเพื่อบันทึกข้อมูล</button>
    </form>

    <div id="spinner">
      <div class="spinner-border text-success" role="status"></div>
      <p class="mt-2">กำลังอัปโหลด...</p>
    </div>
  </div>
</div>

<script>
  async function checkin() {
    try {
      await liff.init({ liffId: LIFF_ID });
      if (!liff.isLoggedIn()) {
        liff.login();
        return;
      }

      const profile = await liff.getProfile();
      const remark = document.getElementById("remark").value;
      const placeName = document.getElementById("place_name").value;
      const check_type = document.getElementById("check_type").value;
      const photoInput = document.getElementById("photoInput");

      const formData = new FormData();
      formData.append("user_id", profile.userId);
      formData.append("check_type", check_type);
      formData.append("display_name", profile.displayName);
      formData.append("remark", remark);
      formData.append("place_name", placeName);

      for (let i = 0; i < photoInput.files.length; i++) {
        formData.append("photo[]", photoInput.files[i]);
      }

      document.getElementById("spinner").style.display = "block";

      // ส่งข้อมูลทันที ไม่แนบพิกัด
      submitForm(formData, profile, remark);
    } catch (err) {
      alert("เกิดข้อผิดพลาด: " + err.message);
    }
  }

  function submitForm(formData, profile, remark) {
    fetch("https://ps33.themediathai.com/line_oa/house/send_message_api.php", {
      method: "POST",
      body: formData
    })
            .then(res => res.text())
            .then(() => {
              if (liff.isInClient()) {
                liff.sendMessages([{
                  type: "text",
                  text: `📩 ส่งข้อมูลสำเร็จแล้ว\n👤 ${profile.displayName}\n📝 ${remark}`
                }])
                        .then(() => {
                          alert("✅ ส่งข้อมูลและข้อความสำเร็จ");
                          liff.closeWindow();
                        })
                        .catch(() => {
                          alert("ส่งข้อมูลสำเร็จ แต่ส่งข้อความไม่สำเร็จ");
                          liff.closeWindow();
                        });
              } else {
                alert("✅ ส่งข้อมูลสำเร็จ (แต่ไม่ได้เปิดใน LINE)");
                liff.closeWindow();
              }
            })
            .catch(err => {
              alert("❌ ไม่สามารถบันทึกได้: " + err.message);
            })
            .finally(() => {
              document.getElementById("spinner").style.display = "none";
            });
  }

  document.addEventListener("contextmenu", e => e.preventDefault());
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
