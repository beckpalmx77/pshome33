                <input type="file" name="photo[]" id="photoInput" accept="image/*" multiple class="form-control">

        </form>

        <div id="spinner">

<script>
    
    async function checkin() {
        const saveBtn = document.getElementById("saveBtn");

        try {
            saveBtn.disabled = true; // ปิดการกดปุ่มซ้ำ

            await liff.init({liffId: LIFF_ID});
            if (!liff.isLoggedIn()) {
                liff.login();
                saveBtn.disabled = false; // ถ้า login ต้องเปิดปุ่มคืน
                return;
            }

            const profile = await liff.getProfile();
            const remark = document.getElementById("remark").value.trim();
            const placeName = document.getElementById("place_name").value;
            const check_type = document.getElementById("check_type").value;
            const photoInput = document.getElementById("photoInput");

            if (remark.length < 15) {
                alert("กรุณากรอกรายละเอียดอย่างน้อย 15 ตัวอักษร");
                saveBtn.disabled = false; // เปิดปุ่มถ้า validate ไม่ผ่าน
                return;
            }

            const formData = new FormData();
            formData.append("user_id", profile.userId);
            formData.append("check_type", check_type);
            formData.append("display_name", profile.displayName);
            formData.append("remark", remark);
            formData.append("place_name", placeName);

            for (let i = 0; i < photoInput.files.length; i++) {
                formData.append("photo[]", photoInput.files[i]);
            }

            document.getElementById("spinner").style.display = "block";

            // รอผลการส่งฟอร์มก่อนเปิดปุ่มอีกครั้ง
            await submitForm(formData, profile, remark);

            saveBtn.disabled = false; // เปิดปุ่มหลังส่งเสร็จ
            document.getElementById("spinner").style.display = "none";

        } catch (err) {
            alert("เกิดข้อผิดพลาด: " + err.message);
            saveBtn.disabled = false; // เปิดปุ่มเมื่อเกิด error
            document.getElementById("spinner").style.display = "none";
        }
    }


    function submitForm(formData, profile, remark) {
        fetch("https://ps33.themediathai.com/line_oa/house/send_message_api.php", {
            method: "POST",
            body: formData
        })
            .then(res => res.json()) // รับ response เป็น JSON
            .then(data => {
                if (data.status !== "success") {
                    throw new Error("Upload failed");
                }

                // สร้างข้อความ text message
                const textMessage = {
                    type: "text",
                    text: `📩 ส่งข้อมูลสำเร็จแล้ว\n👤 ${profile.displayName}\n📝 ${remark}`
                };

                // ถ้ามีรูปภาพที่ backend ส่งกลับมา
                let messages = [textMessage];

                if (data.image_urls && Array.isArray(data.image_urls) && data.image_urls.length > 0) {
                    // ส่งเป็น image message สำหรับแต่ละรูป (ส่งได้สูงสุด 5 รูปต่อครั้ง LIFF จำกัด)
                    const imageMessages = data.image_urls.slice(0, 5).map(url => ({
                        type: "image",
                        originalContentUrl: url,
                        previewImageUrl: url
                    }));
                    messages = messages.concat(imageMessages);
                }

                if (liff.isInClient()) {
                    return liff.sendMessages(messages)
                        .then(() => {
                            alert("✅ ส่งข้อมูลและข้อความสำเร็จ");
                            liff.closeWindow();
                        })
                        .catch(() => {
                            alert("ส่งข้อมูลสำเร็จ แต่ส่งข้อความไม่สำเร็จ");
                            liff.closeWindow();
                        });
                } else {
                    alert("✅ ส่งข้อมูลสำเร็จ (แต่ไม่ได้เปิดใน LINE)");
                    liff.closeWindow();
                }
            })
            .catch(err => {
                alert("❌ ไม่สามารถบันทึกได้: " + err.message);
            })
            .finally(() => {
                document.getElementById("spinner").style.display = "none";
            });
    }

</script>
